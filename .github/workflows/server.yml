# Spielt Datenbank-Änderungen ein und installiert die Server-Funktionen (Supabase Edge Functions).
# Läuft bei Änderungen im Ordner supabase/ oder per Hand (Actions → Server → Run workflow).
# Einmalig nötig: Settings → Secrets and variables → Actions → Secret SUPABASE_ACCESS_TOKEN.
# Darüber findet der Workflow das Supabase-Projekt („waehlwerk-crm“) selbst. Nur bei mehreren
# Projekten zusätzlich die Variable SUPABASE_PROJECT_REF eintragen. Das Datenbank-Passwort ist
# nicht nötig (die Supabase CLI meldet sich mit dem Token an); SUPABASE_DB_PASSWORD geht optional.
name: Server

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/supabase-project.sh'
      - '.github/workflows/server.yml'
  workflow_dispatch:

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Tests der Server-Funktionen
        working-directory: supabase/functions
        run: deno test --allow-env _tests/

      - name: Supabase-Zugang prüfen
        id: access
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::Noch kein Supabase-Zugang (Secret SUPABASE_ACCESS_TOKEN) – Installation übersprungen. Siehe EINRICHTUNG.md, Schritt 2."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Supabase-Projekt finden
        if: steps.access.outputs.ready == 'true'
        run: bash scripts/supabase-project.sh

      - uses: supabase/setup-cli@v3
        if: steps.access.outputs.ready == 'true'
        with:
          version: latest

      - name: Mit dem Supabase-Projekt verbinden
        if: steps.access.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Datenbank aktualisieren
        if: steps.access.outputs.ready == 'true'
        run: supabase db push --yes

      - name: Region der Server-Funktionen einstellen
        if: steps.access.outputs.ready == 'true'
        run: |
          # Twilio ruft die Funktionen dort auf, wo die Datenbank liegt (Standard: Frankfurt)
          case "$SUPABASE_REGION" in
            eu-central-1) echo "Frankfurt – Standard, nichts zu tun." ;;
            ap-northeast-1|ap-northeast-2|ap-south-1|ap-southeast-1|ap-southeast-2|ca-central-1|eu-west-1|eu-west-2|eu-west-3|sa-east-1|us-east-1|us-west-1|us-west-2)
              supabase secrets set "CRM_FUNCTION_REGION=$SUPABASE_REGION" --project-ref "$SUPABASE_PROJECT_REF" ;;
            *)
              supabase secrets set CRM_FUNCTION_REGION=off --project-ref "$SUPABASE_PROJECT_REF" ;;
          esac

      - name: Server-Funktionen installieren
        if: steps.access.outputs.ready == 'true'
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
