# Prüft bei jeder Änderung die Datenbank (Migrationen, Rechte, Abläufe), den Abgleich aller
# Abfragen im Code mit dem Datenbank-Aufbau und die Server-Funktionen.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  datenbank:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Pakete installieren
        run: npm ci

      - name: Datenbank und Abfragen prüfen
        run: npm run test:db

  funktionen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Server-Funktionen prüfen
        run: npm run test:functions
