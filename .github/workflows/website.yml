# Baut das CRM und veröffentlicht es auf GitHub Pages – bei jeder Änderung am Code.
# Einmalig nötig: Settings → Pages → Source: „GitHub Actions“ und unter Settings → Secrets and
# variables → Actions das Secret SUPABASE_ACCESS_TOKEN (darüber findet die Website ihr
# Supabase-Projekt und den öffentlichen Schlüssel). Alternativ die Variablen SUPABASE_URL und
# SUPABASE_ANON_KEY eintragen. Optional: Variable APP_NAME (Name oben links).
name: Website

on:
  push:
    branches: [main]
    paths-ignore:
      - 'supabase/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Pakete installieren
        run: npm ci

      - name: Prüfen (Typen und Tests)
        run: |
          npm run typecheck
          npm test

      - name: Supabase-Projekt finden
        if: ${{ vars.SUPABASE_URL == '' || vars.SUPABASE_ANON_KEY == '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Weder das Secret SUPABASE_ACCESS_TOKEN noch die Variablen SUPABASE_URL/SUPABASE_ANON_KEY sind eingetragen – die Website startet im Demo-Modus."
          else
            bash scripts/supabase-project.sh --keys
          fi

      - name: Zugangsdaten der Datenbank eintragen
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || env.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || env.SUPABASE_ANON_KEY }}
          APP_NAME: ${{ vars.APP_NAME }}
        run: node scripts/write-config.mjs

      - name: Bauen
        run: npm run build

      - id: pages
        uses: actions/configure-pages@v5

      - name: Anmelde-Links auf diese Adresse einstellen
        if: ${{ env.SUPABASE_PROJECT_REF != '' }}
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: bash scripts/supabase-auth.sh "${{ steps.pages.outputs.base_url }}"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
